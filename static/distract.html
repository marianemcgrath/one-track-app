<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OneTrack — Distraction Zone</title>

    <link rel="stylesheet" href="static/css/style.css">

    <style>

        .game-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: #1a1a1a;
            border-radius: 20px;
            text-align: center;
        }

        .timer {
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .status {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .memory-card-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 90px);
            gap: 14px;
            justify-content: center;
            margin: 20px auto;
        }

        .memory-card {
            width: 90px;
            height: 90px;
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            line-height: 1;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s ease;
            user-select: none;
        }

    @media (max-width: 768px) {
        .memory-card-grid {
            grid-template-columns:
                repeat(4, 72px);
            gap: 10px;
        }

        .memory-card {
            width: 72px;
            height: 72px;
            font-size: 2.5rem;
            border-radius: 12px;
        }
    }

        .memory-card.flipped,
        .memory-card.matched {
            background: #d4af37;
            color: #1a1a1a;
        }

        .memory-card.matched {
            opacity: 0.5;
            cursor: default;
        }

        .memory-card:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
        }

        .reset-btn {
            background: #d4af37;
            color: #1a1a1a;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 1rem;
        }

        .api-boost {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #2a2a2a;
            border-radius: 12px;
        }

        .api-boost img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            margin-top: 10px;
        }

    </style>

</head>

<body>

    <div class="app">

        <header>

            <div class="header">

            <img
                src="static/images/onetrack_logo_1.png"
                alt="OneTrack"
                class="logo_design"
            >
                <p class="tagline">
                    One Habit. On Track.
                </p>

            </div>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="support.html">Support</a>
                <a href="distract.html">Distraction Zone</a>
            </nav>

        </header>
        <main>

            <section class="game-container">

                <h1>
                    🎮 Distraction Zone
                </h1>

                <div
                    class="timer"
                    id="timer"
                >
                ⏰ Beat the game and the craving!
                </div>

                <div
                    class="status"
                    id="status"
                >
                    Matches: 0 / 8
                </div>

                <div
                    class="memory-card-grid"
                    id="cardGrid"
                ></div>

                <button
                    class="reset-btn"
                    id="resetBtn"
                >
                    🔄 New Game
                </button>

                <section class="api-boost">

                    <p>
                        🏆
                        <strong>
                            Finish the game for a mood boost.
                        </strong>
                        🐕
                    </p>

                    <div id="boostContent"></div>

                </section>

            </section>

        </main>

    </div>

    <script src="static/js/distract.js"></script>

</body>

</html>
