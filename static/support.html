<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneTrack — Support</title>
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        #support-wrap { display: flex; flex-direction: column; height: calc(100vh - 120px); }
        #support-header { margin-bottom: 20px; }
        #support-header h2 { font-size: 18px; font-weight: 700; color: var(--white); }
        #support-header p { font-size: 13px; color: #aaa; margin-top: 4px; }
        #habit-context-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--grey); border: 1px solid var(--gold); border-radius: 999px; padding: 6px 14px; font-size: 12px; color: var(--gold); margin-top: 12px; }
        #live-timer {margin-top: 14px;font-size: 14px;color: var(--gold-soft);font-weight: 600;letter-spacing: 0.02em;}
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px 0; scrollbar-width: thin; scrollbar-color: var(--grey) transparent; }
        .msg { max-width: 85%; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; animation: fadeUp 0.2s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; background: var(--gold); color: var(--black); border-bottom-right-radius: 4px; font-weight: 500; }
        .msg.ai { align-self: flex-start; background: var(--dark); color: var(--white); border-bottom-left-radius: 4px; border: 1px solid #2a2a2a; }
        .msg.ai.thinking { color: #aaa; font-style: italic; }
        #quick-prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .quick-btn { background: var(--dark); border: 1px solid #3a3a3a; border-radius: 10px; color: var(--white); font-size: 12px; padding: 10px 12px; cursor: pointer; text-align: left; transition: 0.2s ease; line-height: 1.4; }
        .quick-btn:hover { border-color: var(--gold); color: var(--gold); }
        .quick-btn .btn-icon { display: block; font-size: 16px; margin-bottom: 4px; }
        #input-row { display: flex; gap: 8px; align-items: flex-end; padding-top: 8px; border-top: 1px solid #2a2a2a; }
        #chat-input { flex: 1; background: var(--grey); border: 1px solid #3a3a3a; border-radius: 10px; color: var(--white); padding: 10px 12px; font-size: 14px; resize: none; min-height: 44px; max-height: 120px; outline: none; font-family: inherit; transition: border 0.2s ease; }
        #chat-input:focus { border-color: var(--gold); }
        #send-btn { background: var(--gold); border: none; border-radius: 10px; color: var(--black); width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: 0.2s ease; display: flex; align-items: center; justify-content: center; }
        #send-btn:hover { background: var(--gold-soft); }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #no-habit-msg { text-align: center; color: #aaa; font-size: 14px; margin-top: 60px; line-height: 1.6; }
        #no-habit-msg a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>
    <div class="app">

        <header>
            <div class="header">
                <img src="images/onetrack_logo.png" alt="OneTrack" class="logo_design">
                <p class="tagline">One Habit. On Track.</p>
            </div>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="rewards.html">Rewards</a>
                <a href="support.html" class="active">OneTrack Coach</a>
            </nav>
        </header>

        <main>

            <div id="no-habit-msg" style="display:none;">
                <p>You don't have an active habit yet.<br>
                <a href="index.html">Start tracking one first</a> and come back here for support.</p>
            </div>

            <div id="support-wrap" style="display:none;">

                <div id="support-header">
                    <h2>OneTrack Coach</h2>
                    <p>Your personal habit-breaking coach.</p>
                <div id="habit-context-pill">
                    🎯 <span id="pill-text">Loading...</span>
                </div>

                <div id="live-timer"></div>

                <div id="chat-window"></div>

                <div id="quick-prompts">
                    <button class="quick-btn" onclick="sendQuick('I\'m struggling today')">
                        <span class="btn-icon">😔</span>
                        I'm struggling today
                    </button>
                    <button class="quick-btn" onclick="sendQuick('Motivate me')">
                        <span class="btn-icon">💪</span>
                        Motivate me
                    </button>
                    <button class="quick-btn" onclick="sendQuick('What are my stats?')">
                        <span class="btn-icon">📊</span>
                        What are my stats?
                    </button>
                    <button class="quick-btn" onclick="sendQuick('What is happening to my body now?')">
                        <span class="btn-icon">🧬</span>
                        What is happening to my body now?
                    </button>
                </div>

                <div id="input-row">
                    <textarea id="chat-input" placeholder="Ask anything..." rows="1"></textarea>
                    <button id="send-btn" onclick="sendMessage()">➤</button>
                </div>

            </div>

            <p id="loading-msg">Loading...</p>

        </main>
    </div>

    <script src="static/js/app.js"></script>
    <script src="static/js/support.js"></script>
</body>
</html>
