<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneTrack</title>

    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <div class="app">

        <header>

            <div class="header">
                <img
                    src="images/onetrack_logo.png"
                    alt="OneTrack"
                    class="logo_design"
                >

                <p class="tagline">One Habit. On Track.</p>
            </div>

            <nav>
                <a href="index.html" class="active">Dashboard</a>
                <a href="support.html">Coach</a>
                <a href="distract.html">Distraction Zone</a>
            </nav>

        </header>

        <main>

            <!-- Loading State -->

            <div id="loading-msg" class="loading-state">
                Loading...
            </div>

            <!-- State A: No active habit -->

            <section id="profile-section" style="display:none;">

                <h2>Welcome to OneTrack</h2>

                <label for="profile-select">
                    Select Existing Profile
                </label>

                <select id="profile-select">
                    <option value="">Choose profile...</option>
                </select>

                <hr>

                <h3>Create New Profile</h3>

                <form id="create-profile-form">

                    <input
                        type="text"
                        id="profile-name"
                        placeholder="Your name"
                        maxlength="50"
                        required
                    >

                    <button type="submit">
                        Continue
                    </button>

                </form>

            </section>

            <section id="no-habit-section" style="display:none;">

                <h2>Start Your Journey</h2>

                <form id="add-habit-form">

                    <label for="habit-name">
                        What habit are you breaking?
                    </label>

            <select id="habit-name" required>
                <option value="" disabled selected>Select a habit...</option>
                
                <optgroup label="🔥 Most Quit (High Search Volume)">
                    <option value="Vaping">🚬 Vaping — 87k monthly searches</option>
                    <option value="Smoking">🚭 Smoking — 73k monthly searches</option>
                    <option value="Drinking alcohol">🍺 Drinking alcohol — 40k monthly searches</option>
                    <option value="Junk food / snacking">🍩 Junk food / snacking — 29k monthly searches</option>
                </optgroup>
                
                <optgroup label="📱 Digital & Mental Habits">
                    <option value="Excessive phone / social media use">📱 Excessive phone / social media use</option>
                    <option value="Late-night screen time">🌙 Late-night screen time</option>
                    <option value="Procrastination">⏰ Procrastination</option>
                    <option value="Gambling">🎰 Gambling</option>
                </optgroup>
                
                <optgroup label="💪 Physical & Body-Focused">
                    <option value="Nail biting">💅 Nail biting</option>
                    <option value="Stress eating">🍽️ Stress eating</option>
                </optgroup>
                
                <option value="Other">📝 Other (specify below)</option>
            </select>

                    <!-- Custom habit input -->

                    <input
                        type="text"
                        id="habit-name-other"
                        placeholder="Describe your habit"
                        maxlength="50"
                        style="display:none;"
                    >

                    <label for="habit-cost">
                        Daily cost (€)
                    </label>

                    <input
                        type="number"
                        id="habit-cost"
                        placeholder="e.g. 12"
                        min="0"
                        step="0.01"
                        required
                    >

                    <label for="habit-reason">
                        Why are you doing this?
                    </label>

                    <textarea
                        id="habit-reason"
                        placeholder="Your reason (optional)"
                        maxlength="250"
                    ></textarea>

                    <button type="submit">
                        Start Tracking
                    </button>

                </form>

                <p
                    id="add-habit-error"
                    class="error-msg"
                    style="display:none;"
                ></p>

            </section>

            <!-- State B: Active habit -->

            <section id="active-habit-section" style="display:none;">

                <header id="habit-header">

                    <h2 id="habit-name-display"></h2>

                    <div class="habit-actions">
                        <button id="edit-habit-btn">
                            Edit
                        </button>

                        <button
                            id="delete-habit-btn"
                            class="btn-danger"
                        >
                            Delete
                        </button>
                    </div>

                </header>

                <p
                    id="habit-reason-display"
                    class="habit-reason"
                ></p>

                <!-- Stats -->

                <div id="stats-row">

                    <div class="stat-card">
                        <span
                            class="stat-value"
                            id="days-elapsed"
                        >
                            0
                        </span>

                        <span class="stat-label">
                            Days
                        </span>
                    </div>

                    <div class="stat-card">
                        <span
                            class="stat-value"
                            id="days-remaining"
                        >
                            28
                        </span>

                        <span class="stat-label">
                            Days left
                        </span>
                    </div>

                    <div class="stat-card">
                        <span
                            class="stat-value"
                            id="money-saved"
                        >
                            €0
                        </span>

                        <span class="stat-label">
                            Saved
                        </span>
                    </div>

                </div>

                <!-- Progress -->

                <div id="progress-bar-wrap">

                    <div
                        id="progress-bar"
                        role="progressbar"
                    ></div>

                </div>

                
                <!-- Edit Habit -->

                <div
                    id="edit-habit-section"
                    style="display:none;"
                >

                    <h3>Edit Habit</h3>

                    <form id="edit-habit-form">

                        <input
                            type="text"
                            id="edit-habit-name"
                            placeholder="Habit name"
                            maxlength="50"
                            required
                        >

                        <input
                            type="number"
                            id="edit-habit-cost"
                            placeholder="Daily cost (€)"
                            min="0"
                            step="0.01"
                            required
                        >

                        <textarea
                            id="edit-habit-reason"
                            placeholder="Your reason"
                            maxlength="250"
                        ></textarea>

                        <button type="submit">
                            Save Changes
                        </button>

                        <button
                            type="button"
                            id="cancel-edit-btn"
                        >
                            Cancel
                        </button>

                    </form>

                </div>

            </section>

        </main>

    </div>

    <script src="static/js/app.js"></script>
    <script src="static/js/dashboard.js"></script>

</body>

</html>
